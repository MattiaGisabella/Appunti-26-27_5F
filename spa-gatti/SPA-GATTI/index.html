<html>
    <head>
        <title>SPA gatti</title>
        <style>
            body{
                padding: 20px;
                text-align: center; /* permette di centrare il contenuto della pagina */
            }

            img{
                height: 450px; /* permette di avere un'altezza fissa per l'immagine del gatto */
            }

            button{
                padding: 5px;
                background-color: #00b6ee;
                border: 1px solid black;
                border-radius: 3px; /* permette di avere un bordo arrotondato */
                font-size: 20px;
            }

            #gatti-salvati{
                border: 5px solid black; /* permette di avere un bordo intorno alle immagini salvate */
                padding: 20px; /* permette di avere uno spazio tra il bordo e le immagini salvate */
                display: flex; /*permette di allineare le immagini salvate in orizzontale*/
                justify-content: space-around; /*permette di distribuire lo spazio tra le immagini salvate in modo uniforme*/
                flex-wrap: wrap; /*permette di andare a capo se le immagini salvate sono troppe per stare in una riga*/

            }

            #gatti-salvati img{
                height: 100px;
                
            }
        </style>
    </head>

    <body>
        <div>
            <button id="nuovo-gatto">Nuovo gatto</button> 
            <button id="salva-gatto">Salva gatto</button>

        </div>
        <img src="" alt="" id="gatto-img">

        <div id="gatti-salvati">

        </div>

        <script>
        let arrayGatti = []; // array vuoto

            const imgTag = document.getElementById("gatto-img");//prende l'elemento img con id "gatto-img"
            const bottone = document.getElementById("nuovo-gatto");

            bottone.addEventListener("click", () => getCat()); //aggiunge un event listener al bottone che chiama la funzione getCat() quando viene cliccato

            const gattiSalvati = document.getElementById("gatti-salvati");
            const salva = document.getElementById("salva-gatto");
            salva.addEventListener("click", () => {
                arrayGatti.push(imgTag.src);
                renderizzaGatti();

                const newImg = document.createElement("img");
                newImg.src = imgTag.src;
                gattiSalvati.appendChild(newImg);//aggiunge l'immagine salvata al div dei gatti salvati
            });

            function renderizzaGatti(){
                // svuotiamo il div "gatti-salvati"
                gattiSalvati.innerHTML = "";

                // riempiamo il div con i gatti nell'array 
                arrayGatti.forEach((urlGatto) => {
                    const newImg = document.createElement("img");
                    newImg.src = urlGatto;
                    gattiSalvati.appendChild(newImg);
                })
            }


            async function getCat(){
                const url = "https://cataas.com/cat/gif?json=true";
                try{
                    const response = await fetch(url); //manda una richiesta http all'url
                    console.log("RISPOSTA",response);//stampa la response
                    const data = await response.json();//estrae i dati JSON dalla risposta
                    console.log("DATI",data.url);//stampa solo l'url
                    imgTag.src = data.url; //imposta l'attributo src dell'immagine
                } catch (e){
                    console.log("ERRORE",e.message);
                }
            }
            getCat();

        </script>
    </body>
</html>
